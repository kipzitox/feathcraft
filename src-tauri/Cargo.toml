[package]
name = "fheatcraft"
version = "1.0.0"
description = "fheatcraft: pro 3D drawing app (Expo RN replacement, Tauri v2 spike)"
edition = "2021"
rust-version = "1.77.2"

# Tauri v2 mobile (Android) loads the app through a JNI entry point, so the
# crate must also build as a cdylib/staticlib linked into libfheatcraft_lib.
[lib]
name = "fheatcraft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Phase 2: native dialogs, file system access and open-with
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
base64 = "0.22"
